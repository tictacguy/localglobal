# Host-nginx reverse proxy for localglobal.it (+ www redirect).
# App containers publish on 127.0.0.1:47880 (web) and 127.0.0.1:47891 (api).
# Cert (certbot webroot /var/www/certbot) must cover BOTH localglobal.it and www.

upstream localglobal_web {
    server 127.0.0.1:47880;
    keepalive 32;
}

upstream localglobal_api {
    server 127.0.0.1:47891;
    keepalive 32;
}

# HTTP → HTTPS (apex), and ACME challenge
server {
    listen 80;
    server_name localglobal.it www.localglobal.it;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://localglobal.it$request_uri;
    }
}

# www → apex (over HTTPS)
server {
    listen 443 ssl;
    server_name www.localglobal.it;

    ssl_certificate /etc/letsencrypt/live/localglobal.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/localglobal.it/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://localglobal.it$request_uri;
}

# HTTPS main
server {
    listen 443 ssl;
    server_name localglobal.it;

    ssl_certificate /etc/letsencrypt/live/localglobal.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/localglobal.it/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25m;

    # API → backend container
    location /api/ {
        proxy_pass http://localglobal_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600;
        proxy_connect_timeout 10;
        proxy_send_timeout 600;
    }

    # Static SPA container
    location / {
        proxy_pass http://localglobal_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
